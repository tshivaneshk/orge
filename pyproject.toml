[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orge"
version = "2.1.0"
description = "A modern, safe, cross-platform, open-source file organization engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ORGE Contributors" }
]
keywords = ["file-organizer", "automation", "cleaner", "cli", "cross-platform", "safe"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
orge = "orge.cli.main:main"

[project.urls]
Homepage = "https://github.com/tshivaneshk/orge"
Repository = "https://github.com/tshivaneshk/orge"
Issues = "https://github.com/tshivaneshk/orge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/orge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
