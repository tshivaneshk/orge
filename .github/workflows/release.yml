name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Python Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-windows:
    name: Build Windows Standalone & Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller hatchling pyside6 pillow pefile build

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows Standalone, Portable Package, and Installer
        shell: pwsh
        run: |
          python packaging/build.py

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.zip
            dist-installer/*.exe

  build-linux:
    name: Build Linux Standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller hatchling

      - name: Build standalone executable
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --name orge --paths src src/orge/__main__.py

      - name: Create Linux tar.gz
        run: |
          ver="${GITHUB_REF_NAME#v}"
          tar -czvf "dist/orge-${ver}-linux-x64.tar.gz" -C dist/orge .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*.tar.gz

  build-macos:
    name: Build macOS Standalone
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller hatchling

      - name: Build standalone executable
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --name orge --paths src src/orge/__main__.py

      - name: Create macOS tar.gz
        run: |
          ver="${GITHUB_REF_NAME#v}"
          tar -czvf "dist/orge-${ver}-macos.tar.gz" -C dist/orge .

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/*.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-packages, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          find . -maxdepth 2 -type f ! -name "SHA256SUMS" -exec sha256sum {} + > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
            release-assets/**/*
          body_path: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
